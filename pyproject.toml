[project]
name = "statecraft"
version = "0.1.0"
description = "Controllable benchmark environments for programmatic tool-calling agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    ".",
    "environments/standard_statecraft",
    "environments/ptc_statecraft",
]

[tool.uv.sources]
statecraft = { workspace = true }

[project.optional-dependencies]
datasets = ["datasets>=4.0.0"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
statecraft = "statecraft.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/statecraft"]

[tool.hatch.build.targets.sdist]
only-include = ["src/statecraft", "docs", "experiments", "README.md", "LICENSE", "pyproject.toml"]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 1
