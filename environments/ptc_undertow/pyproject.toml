[project]
name = "ptc-undertow"
description = "Undertow programmatic tool-calling Verifiers environment"
tags = ["undertow", "programmatic-tool-calling", "eval"]
version = "0.1.0"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "undertow",
    "verifiers>=0.1.15.dev7",
    "datasets>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["ptc_undertow.py", "pyproject.toml", "LICENSE"]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 1
